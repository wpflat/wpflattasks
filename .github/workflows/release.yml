name: Release

# Push a tag like v0.1.0 (it must match the "Version:" line in bizytasks.php) and this attaches an installable zip to a GitHub release.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: bizytasks

      - name: Check the tag matches the plugin version
        run: |
          V=$(grep -m1 '^ \* Version:' bizytasks/bizytasks.php | awk '{print $3}')
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Version: $V in bizytasks.php" >&2
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Build the zip (the plugin folder, without development files)
        run: |
          zip -rq "bizytasks-$VERSION.zip" bizytasks \
            -x "bizytasks/.git/*" "bizytasks/.github/*" "bizytasks/.gitignore" "bizytasks/ui/*" "bizytasks/vite*.js" "bizytasks/package*.json" "bizytasks/API.md" \
               "bizytasks/node_modules/*" "bizytasks/lib/dompdf/tests/*" '*.DS_Store'
          cp "bizytasks-$VERSION.zip" bizytasks.zip   # a stable name, so .../releases/latest/download/bizytasks.zip always works
          unzip -l bizytasks.zip | tail -1

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bizytasks-${{ env.VERSION }}.zip
            bizytasks.zip
          generate_release_notes: true
